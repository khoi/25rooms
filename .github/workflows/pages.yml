name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Version page assets and collection links
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const entrypoint = 'dist/index.html';
          let html = readFileSync(entrypoint, 'utf8');
          for (const asset of ['style.css', 'main.js']) {
            html = html.replace(`"./${asset}"`, `"./${asset}?v=${process.env.GITHUB_SHA}"`);
          }
          html = html.replace(/href="(\?collection=[^"]+)"/g, (_, href) => `href="${href}&amp;v=${process.env.GITHUB_SHA}"`);
          writeFileSync(entrypoint, html);
          JS
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
